name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The core framework is tested against a mock Roblox environment, so the
      # standalone Luau interpreter is all that is needed — no engine, no
      # executor.
      - name: Install Luau
        run: |
          curl -sL -o luau.zip \
            https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -q -o luau.zip -d luau
          chmod +x luau/*
          echo "$PWD/luau" >> "$GITHUB_PATH"

      - name: Verify module graph resolves
        run: python tools/build.py --check

      - name: Build
        run: python tools/build.py

      - name: Compile check
        run: luau-compile --null dist/Abyssal.lua

      - name: Test
        run: |
          python tools/build.py --entry tools/tests/entry --out dist/Abyssal.test.lua
          luau dist/Abyssal.test.lua
