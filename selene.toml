std = "roblox"

# Roblox's own standard library covers the base API. Executor globals are not
# part of that std, so the ones Abyssal actually uses are declared here rather
# than silenced project-wide — a typo in one of them should still be an error.
#
# If you start using another executor global, add it here. Do not add globals
# speculatively; an unused declaration hides the mistake it would have caught.
[[globals]]
name = "getgenv"
args = []

[[globals]]
name = "loadstring"
args = [{ type = "string" }]

[[globals]]
name = "setclipboard"
args = [{ type = "string" }]
