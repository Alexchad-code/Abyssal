std = "roblox"

# Roblox's own standard library covers the base API. Executor globals that the
# hub relies on (getgenv, loadstring, HttpGet, identifyexecutor, ...) are not
# part of that std, so they are declared as globals rather than silenced
# project-wide. See docs/ARCHITECTURE.md for the executor surface we depend on.
[[globals]]
name = "getgenv"
args = []

[[globals]]
name = "loadstring"
args = [{ type = "string" }]

[[globals]]
name = "identifyexecutor"
args = []

[[globals]]
name = "getexecutorname"
args = []

[[globals]]
name = "hookfunction"
args = [{ type = "any" }, { type = "any" }]

[[globals]]
name = "getrawmetatable"
args = [{ type = "any" }]

[[globals]]
name = "setreadonly"
args = [{ type = "any" }, { type = "bool" }]

[[globals]]
name = "gethui"
args = []

[[globals]]
name = "setclipboard"
args = [{ type = "string" }]

[[globals]]
name = "queue_on_teleport"
args = [{ type = "string" }]
